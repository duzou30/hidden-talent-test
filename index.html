<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ee"><title>你的隐藏天赋测试</title><style>:root{--bg:#fff8ee;--peach:#ff9e7d;--mint:#8fd0b2;--yellow:#ffd66b;--ink:#4a3428;--paper:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}button{font:inherit;color:inherit;cursor:pointer}#app{min-height:100svh;max-width:740px;margin:auto;padding:20px 16px 12px;display:flex;flex-direction:column}.screen{flex:1;display:flex;flex-direction:column;justify-content:center}.card{background:var(--paper);padding:24px;border:1px solid #f1e4d5;border-radius:26px;box-shadow:0 12px 36px #76583b12}.hero{text-align:center;align-items:center}.hero h1{font-size:clamp(32px,8vw,46px);line-height:1.25;margin:12px 0}.hero p{color:#806a5b}.icon{width:140px;height:140px;margin:18px auto;border-radius:48%;background:#ffe8d9;display:grid;place-items:center;font-size:76px}.preview{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 18px}.preview span,.tag{background:#fff0d4;border-radius:99px;padding:6px 12px;font-size:14px}.primary,.secondary{border:0;border-radius:999px;min-height:52px;padding:13px 22px;font-weight:750}.primary{background:var(--peach);color:white}.secondary{background:#f4eadc}.hint,.footer{font-size:12px;color:#927d6f}.footer{text-align:center;padding-top:14px}.hint{margin-top:10px}.top{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.track{height:8px;background:#f0e6d9;border-radius:99px;margin:12px 0 22px;overflow:hidden}.fill{height:100%;background:var(--peach)}.question{font-size:24px;line-height:1.4;margin:0 0 18px}.options{display:grid;gap:10px}.option{min-height:56px;text-align:left;padding:13px 16px;border:1px solid #efe2d3;border-radius:18px;background:#fff}.option:hover{border-color:var(--peach);background:#fff4ed}.option:active,.primary:active,.secondary:active{transform:scale(.98)}.back{border:0;background:none;text-align:left;color:#806a5b;padding:12px 0 0}.loading{text-align:center;align-items:center}.loading .icon{margin:0 auto 20px}.dots{display:flex;gap:8px;margin:16px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--peach);animation:b .7s infinite alternate}.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}@keyframes b{to{transform:translateY(-8px);opacity:.5}}.result-head{text-align:center}.result-head .icon{width:118px;height:118px;font-size:64px;margin:0 auto 12px}.result-head h2{font-size:28px;margin:6px}.slogan{color:#806a5b;margin:4px 0 14px}.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.tag{background:#e8f5ee;font-weight:700}.result h3{font-size:16px;margin:18px 0 5px}.result p{margin:0;color:#70594a}.match{margin-top:12px;background:#fff5d8;padding:12px;border-radius:16px}.actions{display:grid;gap:9px;margin-top:17px}.actions button{width:100%}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#4a3428;color:white;padding:10px 17px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1}@media(max-width:480px){#app{padding:17px 14px 10px}.card{padding:20px 16px}.question{font-size:22px}}</style></head><body><main id="app"></main><div id="toast" class="toast" role="status"></div><script>const results=[{"id":"empathy","name":"读心共情","emoji":"💗","slogan":"你能听见别人没说出口的那半句话","tags":["共情","倾听","洞察"],"read":"朋友常愿意找你说心事，因为你不急着给结论，会先听清对方真正卡住的地方。你能察觉语气和情绪变化，适合把这份能力用在沟通、用户研究、服务支持或团队协作里。下次聊天试着复述对方的重点，看看你的理解能不能帮人理清头绪。","bright":"让人觉得被认真理解","quirk":"容易把别人的情绪也背回家","match":"情绪治愈","lucky":"一张写着暖心话的便签","color":"#f7e5e9"},{"id":"logic","name":"逻辑推理","emoji":"🔎","slogan":"线索散落一地，你总能把它们连起来","tags":["分析","好奇","清晰"],"read":"遇到复杂问题，你会自然开始找条件、比证据、排除不合理的解释。你不满足于“大家都这么说”，更想知道它为什么成立；这适合用在研究、数据、产品分析和问题排查。选一个日常小问题，写下假设再找证据，就是很好的练习。","bright":"能把混乱信息整理成清楚结论","quirk":"有时解释得太完整，听众已经等着吃饭","match":"商业嗅觉","lucky":"一支顺手的荧光笔","color":"#e5eaf4"},{"id":"aesthetic","name":"审美创造","emoji":"🎨","slogan":"你总能发现普通画面里不普通的地方","tags":["审美","想象","表达"],"read":"你对颜色、构图和氛围有自己的直觉，看到一个东西会想到它还能怎么呈现。灵感不只来自艺术，也可能来自穿搭、空间、照片或一段文字；视觉设计、内容包装和品牌表达都能承接这份敏感。建一个灵感收集夹，再每周完成一张小作品，让感觉逐渐变成方法。","bright":"能给想法找到好看的表达方式","quirk":"灵感来了想做十个版本才肯收工","match":"语言表达","lucky":"一盒彩色便签","color":"#f5e3ef"},{"id":"words","name":"语言表达","emoji":"✍️","slogan":"你能把心里的意思，变成别人听得懂的话","tags":["表达","叙事","感染力"],"read":"你擅长抓住重点，也会根据听众换一种说法。讲经历时你能找到有画面的细节，解释事情时又能把顺序理清；写作、教学、沟通和内容创作都用得上。可以从写一段 150 字的推荐或录一段一分钟讲解开始，练习让观点更具体。","bright":"把复杂意思说得清楚又有趣","quirk":"脑中有金句时容易忘记先讲结论","match":"读心共情","lucky":"一本随手记灵感的小本子","color":"#f8e8d9"},{"id":"organize","name":"组织领导","emoji":"🧭","slogan":"大家还在找方向时，你已经画出下一步","tags":["协调","担当","推进"],"read":"你会留意谁擅长什么、事情卡在哪里，也愿意把模糊目标拆成可执行的小步。你未必需要站在最前面发号施令，常常是让协作真正动起来的人；项目推进、活动统筹和团队协作都适合你试试。下一次合作可以主动做一张简单分工表，观察大家是否更顺畅。","bright":"让团队从讨论走到交付","quirk":"容易默默接下太多任务","match":"商业嗅觉","lucky":"一张写好重点的清单","color":"#e4f1e9"},{"id":"craft","name":"匠人手艺","emoji":"🪡","slogan":"反复打磨之后，细节会替你说话","tags":["耐心","手感","专注"],"read":"你愿意花时间把东西做扎实，也能享受从粗糙到顺手的过程。无论是烘焙、修理、模型、代码还是整理资料，你都可能在重复练习中越做越稳；需要精度与持续改进的事情很适合你。选一个小项目，记录每次调整带来的变化，作品会成为最好的进步证据。","bright":"专注时能把细节做到位","quirk":"还没交付就想再打磨一下","match":"审美创造","lucky":"一把趁手的小工具","color":"#f4ead8"},{"id":"business","name":"商业嗅觉","emoji":"💡","slogan":"你会好奇：大家为什么愿意为它买单？","tags":["机会感","务实","判断"],"read":"你常能从需求、价格和时机里看见机会，也愿意验证一个点子到底有没有人需要。你不只想“做出来”，还会问它解决了什么麻烦、怎样持续运转；产品、市场、经营和资源整合都值得探索。试着访谈三位潜在用户，再用最小版本验证想法。","bright":"能把需求和可行办法连起来","quirk":"容易在脑内先开一家完整公司","match":"组织领导","lucky":"一张记录灵感的收据","color":"#fff0d0"},{"id":"healing","name":"情绪治愈","emoji":"🫶","slogan":"和你待一会儿，心情就有地方落脚","tags":["温和","稳定","安抚"],"read":"你给人的感觉通常不急不躁，能用小小的行动让人重新稳下来。你擅长营造安全感，也知道陪伴不一定要马上解决问题；教育支持、社区服务、照护协作和友善的团队氛围都能用上这份能力。记得先照顾自己的电量，再把温柔分给别人。","bright":"让紧张的场面慢慢松下来","quirk":"容易把“我来陪你”变成全天待命","match":"读心共情","lucky":"一杯温热的饮品","color":"#e6f2ed"}];const questions=[["小时候大家最常夸你什么？",["很会察言观色、懂事贴心",["empathy","healing"]],["脑子快，题目一看就有思路",["logic","business"]],["画画搭配有想法，东西做得好看",["aesthetic","words"]],["做事有条理，大家都愿意听你安排",["organize","craft"]]],["碰到一个完全没接触过的新东西，你会？",["先找原理和规律，弄明白再动手",["logic","craft"]],["先做个小样，边试边调整",["craft","aesthetic"]],["找人聊聊需求和用途，看看值不值得做",["business","empathy"]],["先想怎么讲给别人听或一起完成",["words","organize"]]],["刷手机时，哪类内容最容易让你停下来？",["人物故事、关系观察或情绪共鸣",["empathy","words"]],["解谜、知识拆解、数据分析",["logic","business"]],["视觉灵感、穿搭、空间和手作",["aesthetic","craft"]],["效率方法、团队协作、项目幕后",["organize","healing"]]],["朋友找你帮忙，你最常自然接手哪部分？",["听他讲清楚烦恼，陪他理理感受",["empathy","healing"]],["找出问题在哪，列出几种办法",["logic","organize"]],["帮忙把东西做出来、修好或排版",["craft","aesthetic"]],["想个能落地的点子，再讲清楚怎么推进",["business","words"]]],["一群人讨论卡住时，你会？",["先确认大家真正担心的是什么",["empathy","healing"]],["把已知信息写出来，找缺的那块",["logic","organize"]],["换个呈现方式，让方案更吸引人",["aesthetic","words"]],["判断最值得尝试的一步并推动试试",["business","craft"]]],["你更容易记住什么？",["别人说话时的情绪和在意点",["empathy","healing"]],["数字、规则和事情之间的因果",["logic","business"]],["色彩、造型和画面带来的感觉",["aesthetic","craft"]],["谁负责什么、事情进行到哪一步",["organize","words"]]],["临时要做一份展示，你会先？",["想清楚听众需要被理解的重点",["empathy","words"]],["搭出论点和证据的顺序",["logic","organize"]],["定下视觉风格和整体氛围",["aesthetic","craft"]],["想清楚要达成什么、如何让人行动",["business","healing"]]],["遇到突发状况，你的第一反应？",["先看谁需要安抚或支持",["healing","empathy"]],["快速辨认事实和风险",["logic","business"]],["动手先处理最明显的问题",["craft","organize"]],["把情况讲清楚并协调下一步",["words","organize"]]],["你最享受哪种“做完了”的感觉？",["对方说：你真的懂我",["empathy","healing"]],["谜题解开，答案经得起推敲",["logic","business"]],["脑海里的画面终于变成作品",["aesthetic","craft"]],["大家顺利合作，目标也达成了",["organize","words"]]],["朋友夸你时，哪句最让你开心？",["“跟你说完舒服多了。”",["healing","empathy"]],["“你怎么一下就发现关键了？”",["logic","business"]],["“这个想法/作品好有感觉！”",["aesthetic","craft"]],["“有你在事情就能推进。”",["organize","words"]]],["如果有一个周末小项目，你会选？",["做一份给朋友的情绪陪伴小指南",["healing","words"]],["拆解一个生活问题，做个清晰分析",["logic","business"]],["完成一件手作或视觉小作品",["craft","aesthetic"]],["组织一次小活动，让大家都参与进来",["organize","empathy"]]],["你想把哪种能力练得更厉害？",["读懂需求，也照顾好彼此感受",["empathy","healing"]],["从信息里更快找到可靠结论",["logic","business"]],["把脑中的画面做成真正的作品",["aesthetic","craft"]],["把好想法讲清楚并带着大家行动",["words","organize"]]]];const order=results.map(x=>x.id);let answers=Array(12).fill(null),idx=0;const app=document.querySelector('#app'),foot='<footer class="footer">本测试仅供娱乐，开心就好</footer>';function home(){answers=Array(12).fill(null);idx=0;app.innerHTML=`<section class="screen hero"><div class="icon">💗</div><h1>你的隐藏天赋测试</h1><p>你以为只是顺手，其实那可能正是你的天赋线索。</p><div class="preview">${results.map(x=>`<span>${x.name}</span>`).join('')}</div><button class="primary" id="start">开始测试</button><div class="hint">12 题 · 约 1 分钟 · 无需登录 · 结果可以保存分享</div></section>${foot}`;document.querySelector('#start').onclick=()=>{idx=0;question()}}function question(){const[q,...opts]=questions[idx];app.innerHTML=`<section class="screen"><div class="card"><div class="top"><span>凭第一感觉选就好</span><span>第 ${idx+1} / 12 题</span></div><div class="track"><div class="fill" style="width:${(idx+1)/12*100}%"></div></div><h2 class="question">${q}</h2><div class="options">${opts.map((o,i)=>`<button class="option" data-n="${i}">${'ABCD'[i]}　${o[0]}</button>`).join('')}</div><button class="back" id="back" ${idx===0?'disabled':''}>← 上一题</button></div></section>${foot}`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[idx]=+b.dataset.n;if(idx<11){idx++;question()}else loading()});document.querySelector('#back').onclick=()=>{if(idx>0){idx--;question()}}}function winner(){let scores=Object.fromEntries(order.map(id=>[id,0]));answers.forEach((n,i)=>questions[i][n+1][1].forEach(id=>scores[id]++));return results.find(r=>r.id===order.slice().sort((a,b)=>scores[b]-scores[a]||order.indexOf(a)-order.indexOf(b))[0])}function loading(){app.innerHTML=`<section class="screen loading"><div class="icon">✨</div><h2>正在拼出你的天赋地图…</h2><div class="dots"><i></i><i></i><i></i></div></section>${foot}`;setTimeout(show,1050)}function show(){const r=winner();app.innerHTML=`<section class="screen"><article class="card result"><div class="result-head"><div class="icon" style="background:${r.color}">${r.emoji}</div><h2>${r.name}</h2><div class="slogan">「${r.slogan}」</div><div class="tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><h3>关于你</h3><p>${r.read}</p><h3>你的闪光点</h3><p>${r.bright}</p><h3>小小短板</h3><p>${r.quirk}</p><div class="match"><b>最合拍：${r.match}</b></div><h3>今日幸运物</h3><p>${r.lucky}</p><div class="actions"><button class="primary" id="save">保存结果图</button><button class="secondary" id="copy">复制分享文案</button><button class="secondary" id="again">再测一次</button></div></article></section>${foot}`;document.querySelector('#save').onclick=()=>save(r);document.querySelector('#copy').onclick=()=>copy(`我的${隐藏天赋}结果是「${r.name}」！你测出来会是什么？来一起看看～`);document.querySelector('#again').onclick=home}function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}async function copy(s){try{await navigator.clipboard.writeText(s);toast('分享文案复制好啦！')}catch(e){let t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity=0;document.body.append(t);t.select();try{document.execCommand('copy');toast('分享文案复制好啦！')}catch(_){toast('复制失败，请手动复制')}t.remove()}}function save(r){let c=document.createElement('canvas');c.width=750;c.height=1000;let x=c.getContext('2d');x.fillStyle='#fff8ee';x.fillRect(0,0,750,1000);x.fillStyle='#fffdf8';x.beginPath();x.roundRect(42,42,666,916,40);x.fill();x.textAlign='center';x.fillStyle='#4a3428';x.font='700 38px sans-serif';x.fillText('你的隐藏天赋测试',375,142);x.fillStyle=r.color;x.beginPath();x.arc(375,385,155,0,Math.PI*2);x.fill();x.font='140px sans-serif';x.fillText(r.emoji,375,438);x.fillStyle='#4a3428';x.font='700 48px sans-serif';x.fillText(r.name,375,620);x.fillStyle='#806a5b';x.font='28px sans-serif';x.fillText(r.slogan,375,685);r.tags.forEach((t,i)=>{let xx=140+i*165;x.fillStyle='#e8f5ee';x.beginPath();x.roundRect(xx,738,140,54,27);x.fill();x.fillStyle='#4a3428';x.font='24px sans-serif';x.fillText(t,xx+70,774)});x.fillStyle='#aa9280';x.font='22px sans-serif';x.fillText('本测试仅供娱乐，开心就好',375,890);c.toBlob(b=>{if(!b){toast('图片生成失败');return}let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='hidden-talent-test-result.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('结果图已保存')},'image/png')}home();</script></body></html>
